<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MYTOKEN | SUPER ADMIN</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo',sans-serif}
:root{--bg:#0a0f1c;--card:#111827;--border:#1f2937;--cyan:#00d4ff;--green:#10b981;--red:#ef4444;--gold:#f59e0b;--text:#e5e7eb;--muted:#94a3b8}
body{background:var(--bg);color:var(--text);min-height:100vh}
.header{background:linear-gradient(135deg,#0f172a,#1e293b);padding:15px 20px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100}
.header h1{font-size:18px;color:var(--cyan);font-weight:900}
.tabs{display:flex;gap:10px;padding:15px;background:rgba(15,23,42,.8);overflow-x:auto;border-bottom:1px solid var(--border)}
.tab{padding:10px 20px;background:var(--card);border:1px solid var(--border);border-radius:10px;color:var(--muted);cursor:pointer;font-weight:700;font-size:14px;white-space:nowrap;transition:0.3s}
.tab.active{background:var(--cyan);color:#000;border-color:var(--cyan);box-shadow:0 0 15px rgba(0,212,255,0.4)}
.container{padding:20px;max-width:1200px;margin:auto}
.page{display:none}
.page.active{display:block;animation:fade 0.3s}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:15px;margin-bottom:20px}
.stat-card{background:var(--card);padding:20px;border-radius:15px;border:1px solid var(--border)}
.stat-title{color:var(--muted);font-size:13px;margin-bottom:5px}
.stat-val{font-size:24px;font-weight:900;color:#fff}
.card{background:var(--card);border-radius:15px;border:1px solid var(--border);padding:20px;margin-bottom:20px}
.card h2{font-size:16px;margin-bottom:15px;color:var(--cyan);border-bottom:1px solid var(--border);padding-bottom:10px}
.wd-item{background:#1a2332;border:1px solid var(--border);border-radius:12px;padding:15px;margin-bottom:10px}
.wd-head{display:flex;justify-content:space-between;margin-bottom:10px}
.wd-amount{font-size:20px;font-weight:900;color:var(--gold)}
.wd-details{font-size:13px;color:var(--muted);margin-bottom:10px;line-height:1.6}
.wd-wallet{font-family:monospace;font-size:11px;background:rgba(0,0,0,0.3);padding:8px;border-radius:8px;word-break:break-all;direction:ltr;text-align:left;margin-bottom:10px}
.wd-actions{display:flex;gap:10px}
.btn{padding:10px;border:none;border-radius:8px;font-weight:900;font-family:'Cairo',sans-serif;cursor:pointer;flex:1;transition:0.2s}
.btn-approve{background:var(--green);color:#fff}
.btn-reject{background:var(--red);color:#fff}
.btn:hover{transform:translateY(-2px);opacity:0.9}
.user-item{display:flex;justify-content:space-between;align-items:center;background:#1a2332;padding:12px;border-radius:10px;margin-bottom:8px;border:1px solid var(--border)}
.badge{display:inline-block;padding:3px 8px;border-radius:6px;font-size:11px;font-weight:700;margin-right:5px}
.badge-pending{background:rgba(245,158,11,0.2);color:var(--gold)}
.badge-done{background:rgba(16,185,129,0.2);color:var(--green)}
</style>
</head>
<body>
<div class="header">
    <h1>⚡ MYTOKEN ADMIN V3</h1>
    <div style="font-size:12px;color:var(--green)">● Connected</div>
</div>
<div class="tabs">
    <div class="tab active" onclick="switchTab('dash', this)">📊 Dashboard</div>
    <div class="tab" onclick="switchTab('withdrawals', this)">💸 Withdrawals</div>
    <div class="tab" onclick="switchTab('users', this)">👥 Users</div>
</div>
<div class="container">
    <!-- DASHBOARD -->
    <div id="page-dash" class="page active">
        <div class="stats">
            <div class="stat-card"><div class="stat-title">Total Users</div><div class="stat-val" id="st-users">0</div></div>
            <div class="stat-card"><div class="stat-title">Total Balance</div><div class="stat-val" id="st-bal">0</div></div>
        </div>
    </div>

    <!-- WITHDRAWALS -->
    <div id="page-withdrawals" class="page">
        <div class="card">
            <h2>Pending Withdrawal Requests</h2>
            <div id="wd-list">Loading...</div>
        </div>
    </div>

    <!-- USERS -->
    <div id="page-users" class="page">
        <div class="card">
            <h2>Registered Users</h2>
            <div id="users-list">Loading...</div>
        </div>
    </div>
</div>

<script>
const API = 'https://mytoken-api.vercel.app';
const ADMIN_ID = '8063963886';

async function apiCall(path, body = {}) {
    const res = await fetch(API + path, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({admin_id: ADMIN_ID, ...body})
    });
    return res.json();
}

function switchTab(name, el) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    el.classList.add('active');
    document.getElementById('page-' + name).classList.add('active');
    if(name === 'dash') loadDash();
    if(name === 'withdrawals') loadWithdrawals();
    if(name === 'users') loadUsers();
}

async function loadDash() {
    const d = await apiCall('/api/admin/stats');
    if(d.ok) {
        document.getElementById('st-users').innerText = d.total_users;
        document.getElementById('st-bal').innerText = d.total_balance + ' MYT';
    }
}

async function loadWithdrawals() {
    const d = await apiCall('/api/admin/withdrawals');
    const list = document.getElementById('wd-list');
    if(!d.ok || !d.withdrawals.length) {
        list.innerHTML = '<div style="text-align:center;color:#94a3b8;padding:20px;">No requests found</div>';
        return;
    }
    list.innerHTML = d.withdrawals.map(w => `
        <div class="wd-item">
            <div class="wd-head">
                <div>
                    <div style="font-weight:900">${w.first_name || 'User'}</div>
                    <div style="font-size:11px;color:#94a3b8">ID: ${w.user_id}</div>
                </div>
                <div style="text-align:left">
                    <div class="wd-amount">${w.requested} MYT</div>
                    <div style="font-size:11px;color:${w.status==='pending'?'#f59e0b':'#10b981'}">${w.status.toUpperCase()}</div>
                </div>
            </div>
            <div class="wd-details">
                Requested: ${w.requested} | Platform Fee: ${w.platform_fee} | Network: ${w.network_fee}<br>
                <strong>Net to user: ${w.net_amount} MYT</strong>
            </div>
            <div class="wd-wallet">${w.wallet}</div>
            ${w.status === 'pending' ? `
            <div class="wd-actions">
                <button class="btn btn-approve" onclick="processWD('${w.req_id}', 'approve')">✅ Approve</button>
                <button class="btn btn-reject" onclick="processWD('${w.req_id}', 'reject')">❌ Reject</button>
            </div>` : ''}
        </div>
    `).join('');
}

async function processWD(reqId, action) {
    if(!confirm(`Are you sure you want to ${action} this withdrawal?`)) return;
    const d = await apiCall(`/api/admin/withdrawal/${action}`, {req_id: reqId});
    if(d.ok) {
        alert('Success!');
        loadWithdrawals();
    } else {
        alert('Error: ' + (d.error || 'Unknown'));
    }
}

async function loadUsers() {
    const d = await apiCall('/api/admin/users');
    const list = document.getElementById('users-list');
    if(!d.ok || !d.users.length) {
        list.innerHTML = '<div style="text-align:center;color:#94a3b8;padding:20px;">No users found</div>';
        return;
    }
    list.innerHTML = d.users.map(u => `
        <div class="user-item">
            <div>
                <div style="font-weight:900">${u.first_name || 'Unknown'}</div>
                <div style="font-size:11px;color:#94a3b8;font-family:monospace">ID: ${u.user_id}</div>
            </div>
            <div style="font-weight:900;color:#10b981">${wd.requested} MYT</div>
        </div>
    `).join('');
}

// Load initial data
loadDash();
</script>
</body>
</html>
