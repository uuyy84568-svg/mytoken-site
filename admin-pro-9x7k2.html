<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MYTOKEN • SUPER ADMIN</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo',sans-serif}
:root{--bg:#070b14;--card:#0f1624;--card2:#141d2e;--cyan:#00d4ff;--green:#00ff88;--red:#ff3b5c;--gold:#ffb800;--txt:#e6edf7;--muted:#7a8ba8;--border:rgba(0,212,255,.12)}
body{background:var(--bg);color:var(--txt);min-height:100vh;background-image:radial-gradient(ellipse at top right,rgba(0,212,255,.08),transparent 50%),radial-gradient(ellipse at bottom left,rgba(0,255,136,.05),transparent 50%);background-attachment:fixed}

.topbar{position:sticky;top:0;z-index:100;background:rgba(7,11,20,.9);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:14px 20px;display:flex;justify-content:space-between;align-items:center}
.brand{display:flex;align-items:center;gap:12px}
.brand-logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--cyan),var(--green));display:flex;align-items:center;justify-content:center;font-size:22px;box-shadow:0 0 25px rgba(0,212,255,.4)}
.brand h1{font-size:18px;font-weight:900;background:linear-gradient(90deg,var(--cyan),var(--green));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.brand p{font-size:11px;color:var(--muted)}
.badge-super{padding:6px 14px;background:linear-gradient(135deg,rgba(255,184,0,.2),rgba(255,184,0,.05));border:1px solid rgba(255,184,0,.4);border-radius:20px;font-size:12px;font-weight:700;color:var(--gold);display:flex;align-items:center;gap:6px}

.tabs{display:flex;gap:8px;padding:16px 20px;overflow-x:auto;border-bottom:1px solid var(--border)}
.tab{padding:10px 20px;background:var(--card);border:1px solid var(--border);border-radius:12px;color:var(--muted);cursor:pointer;font-weight:600;font-size:14px;white-space:nowrap;transition:.3s;display:flex;align-items:center;gap:8px}
.tab:hover{border-color:var(--cyan);color:var(--txt)}
.tab.active{background:linear-gradient(135deg,var(--cyan),#0088cc);color:#000;border-color:transparent;box-shadow:0 8px 25px rgba(0,212,255,.4)}

.container{max-width:1400px;margin:0 auto;padding:20px}
.page{display:none;animation:fadeIn .4s}
.page.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:24px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:22px;position:relative;overflow:hidden;transition:.3s}
.stat:hover{transform:translateY(-4px);border-color:var(--cyan);box-shadow:0 15px 40px rgba(0,212,255,.15)}
.stat::before{content:'';position:absolute;top:-50%;right:-50%;width:150%;height:150%;background:radial-gradient(circle,rgba(0,212,255,.1),transparent 60%);pointer-events:none}
.stat .ico{font-size:22px;margin-bottom:12px;width:44px;height:44px;border-radius:12px;background:rgba(0,212,255,.1);display:flex;align-items:center;justify-content:center}
.stat .lbl{color:var(--muted);font-size:13px;margin-bottom:6px;font-weight:600}
.stat .val{font-size:30px;font-weight:900;background:linear-gradient(90deg,var(--cyan),var(--green));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.stat.gold .ico{background:rgba(255,184,0,.1)}
.stat.gold .val{background:linear-gradient(90deg,var(--gold),#ff8a00);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.stat.red .ico{background:rgba(255,59,92,.1)}
.stat.red .val{background:linear-gradient(90deg,var(--red),#ff6b8a);-webkit-background-clip:text;-webkit-text-fill-color:transparent}

.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:24px;margin-bottom:20px}
.card h2{font-size:17px;font-weight:800;margin-bottom:18px;display:flex;align-items:center;gap:10px;color:var(--cyan)}
.card h2 .dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 12px var(--green)}

.chart-wrap{height:280px;position:relative}

.search{position:relative;margin-bottom:16px}
.search input{width:100%;padding:14px 45px 14px 16px;background:var(--card2);border:1px solid var(--border);border-radius:14px;color:var(--txt);font-size:15px;outline:none;font-family:inherit;transition:.3s}
.search input:focus{border-color:var(--cyan);box-shadow:0 0 0 4px rgba(0,212,255,.1)}
.search .ico{position:absolute;right:16px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:16px}

.users-list{display:flex;flex-direction:column;gap:10px;max-height:600px;overflow-y:auto;padding-right:6px}
.users-list::-webkit-scrollbar{width:6px}
.users-list::-webkit-scrollbar-thumb{background:var(--cyan);border-radius:6px}
.user-row{background:var(--card2);border:1px solid var(--border);border-radius:14px;padding:14px;display:flex;align-items:center;gap:14px;transition:.3s}
.user-row:hover{border-color:var(--cyan);transform:translateX(-4px)}
.avatar{width:46px;height:46px;border-radius:12px;background:linear-gradient(135deg,var(--cyan),var(--green));display:flex;align-items:center;justify-content:center;font-weight:900;font-size:18px;color:#000;flex-shrink:0}
.u-info{flex:1;min-width:0}
.u-name{font-weight:700;font-size:14px;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.u-meta{font-size:11px;color:var(--muted);font-family:monospace;direction:ltr;text-align:right}
.u-stats{display:flex;gap:10px;margin-top:6px;flex-wrap:wrap}
.chip{padding:3px 10px;border-radius:8px;font-size:11px;font-weight:700;background:rgba(0,212,255,.1);color:var(--cyan);border:1px solid rgba(0,212,255,.2)}
.chip.bal{background:rgba(0,255,136,.1);color:var(--green);border-color:rgba(0,255,136,.2)}
.chip.ref{background:rgba(255,184,0,.1);color:var(--gold);border-color:rgba(255,184,0,.2)}
.actions{display:flex;gap:6px;flex-shrink:0}
.btn{padding:8px 12px;border:none;border-radius:10px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;transition:.2s;color:#000}
.btn.give{background:var(--green)}
.btn.give:hover{box-shadow:0 0 15px rgba(0,255,136,.5)}
.btn.danger{background:var(--red);color:#fff}
.btn.danger:hover{box-shadow:0 0 15px rgba(255,59,92,.5)}

.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:13px;color:var(--muted);margin-bottom:8px;font-weight:600}
.form-group input,.form-group textarea{width:100%;padding:14px;background:var(--card2);border:1px solid var(--border);border-radius:12px;color:var(--txt);font-size:15px;outline:none;font-family:inherit;transition:.3s;resize:vertical}
.form-group input:focus,.form-group textarea:focus{border-color:var(--cyan);box-shadow:0 0 0 4px rgba(0,212,255,.1)}
.form-group textarea{min-height:130px}
.btn-primary{width:100%;padding:16px;background:linear-gradient(135deg,var(--cyan),#0088cc);border:none;border-radius:14px;color:#000;font-weight:800;font-size:16px;cursor:pointer;font-family:inherit;transition:.3s;box-shadow:0 8px 25px rgba(0,212,255,.3)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 12px 35px rgba(0,212,255,.5)}
.btn-primary.green{background:linear-gradient(135deg,var(--green),#00cc6a);box-shadow:0 8px 25px rgba(0,255,136,.3)}

.toast{position:fixed;top:80px;left:50%;transform:translateX(-50%) translateY(-30px);padding:16px 28px;border-radius:14px;background:var(--card);border:1px solid var(--green);color:var(--green);font-weight:700;z-index:9999;opacity:0;transition:.3s;pointer-events:none;box-shadow:0 20px 50px rgba(0,0,0,.5)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.error{border-color:var(--red);color:var(--red)}

.empty{text-align:center;padding:40px;color:var(--muted)}
.loading{text-align:center;padding:40px;color:var(--cyan)}
.spinner{width:40px;height:40px;border:3px solid rgba(0,212,255,.2);border-top-color:var(--cyan);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}

.status-dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
</style>
</head>
<body>

<div class="topbar">
    <div class="brand">
        <div class="brand-logo">⛏️</div>
        <div>
            <h1>MYTOKEN ADMIN</h1>
            <p style="display:flex;align-items:center;gap:6px"><span class="status-dot"></span> متصل مباشرة</p>
        </div>
    </div>
    <div class="badge-super">⭐ SUPER ADMIN</div>
</div>

<div class="tabs">
    <div class="tab active" onclick="showPage('dashboard',this)">📊 لوحة التحكم</div>
    <div class="tab" onclick="showPage('users',this)">👥 المستخدمون</div>
    <div class="tab" onclick="showPage('give',this)">🎁 منح MYT</div>
    <div class="tab" onclick="showPage('broadcast',this)">📢 بث رسالة</div>
</div>

<div class="container">

    <div class="page active" id="page-dashboard">
        <div class="stats">
            <div class="stat"><div class="ico">👥</div><div class="lbl">إجمالي المستخدمين</div><div class="val" id="s-users">-</div></div>
            <div class="stat gold"><div class="ico">🔥</div><div class="lbl">النشطون اليوم</div><div class="val" id="s-active">-</div></div>
            <div class="stat"><div class="ico">💰</div><div class="lbl">إجمالي الأرصدة</div><div class="val" id="s-balance">-</div></div>
            <div class="stat red"><div class="ico">🎁</div><div class="lbl">إجمالي الإحالات</div><div class="val" id="s-refs">-</div></div>
        </div>
        <div class="card">
            <h2><span class="dot"></span> نظرة عامة</h2>
            <div class="chart-wrap"><canvas id="chart"></canvas></div>
        </div>
    </div>

    <div class="page" id="page-users">
        <div class="card">
            <h2><span class="dot"></span> قائمة المستخدمين</h2>
            <div class="search">
                <input type="text" id="searchBox" placeholder="ابحث بـ ID أو الاسم..." oninput="filterUsers()">
                <span class="ico">🔍</span>
            </div>
            <div class="users-list" id="usersList">
                <div class="loading"><div class="spinner"></div>جاري التحميل...</div>
            </div>
        </div>
    </div>

    <div class="page" id="page-give">
        <div class="card">
            <h2><span class="dot"></span> منح MYT لمستخدم</h2>
            <div class="form-group"><label>ID المستخدم</label><input type="number" id="giveId" placeholder="مثال: 8063963886"></div>
            <div class="form-group"><label>الكمية (MYT)</label><input type="number" id="giveAmount" placeholder="مثال: 100" step="0.01"></div>
            <button class="btn-primary green" onclick="doGive()">🎁 منح الآن</button>
        </div>
    </div>

    <div class="page" id="page-broadcast">
        <div class="card">
            <h2><span class="dot"></span> بث رسالة جماعية</h2>
            <div class="form-group"><label>نص الرسالة</label><textarea id="bcText" placeholder="اكتب رسالتك هنا..."></textarea></div>
            <button class="btn-primary" onclick="doBroadcast()">📢 إرسال للجميع</button>
        </div>
    </div>

</div>

<div class="toast" id="toast"></div>

<script>
const API='https://mytoken-api.vercel.app';
const ADMIN_ID='8063963886';
let allUsers=[];

function toast(m,err){const t=document.getElementById('toast');t.textContent=m;t.className='toast show'+(err?' error':'');setTimeout(()=>t.className='toast'+(err?' error':''),3000)}
function showPage(id,el){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.getElementById('page-'+id).classList.add('active');document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));el.classList.add('active')}

async function apiPost(ep,body){
    const r=await fetch(API+ep,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({admin_id:ADMIN_ID,...body})});
    return r.json();
}

async function loadStats(){
    try{
        const d=await apiPost('/api/admin/stats',{});
        if(!d.ok)return;
        document.getElementById('s-users').textContent=d.total_users||0;
        document.getElementById('s-active').textContent=d.active_users||0;
        document.getElementById('s-balance').textContent=(d.total_balance||0).toFixed(2);
        document.getElementById('s-refs').textContent=d.total_refs||0;
        drawChart(d);
    }catch(e){}
}

function drawChart(d){
    const ctx=document.getElementById('chart').getContext('2d');
    if(window.ch){window.ch.destroy()}
    window.ch=new Chart(ctx,{type:'line',data:{
        labels:['المستخدمون','النشطون','الأرصدة','الإحالات'],
        datasets:[{label:'الإحصائيات',data:[d.total_users||0,d.active_users||0,Math.round(d.total_balance||0),d.total_refs||0],borderColor:'#00d4ff',backgroundColor:'rgba(0,212,255,.15)',tension:.4,fill:true,pointBackgroundColor:'#00ff88',pointBorderColor:'#00d4ff',pointRadius:6,pointHoverRadius:9,borderWidth:3}]
    },options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:'#e6edf7',font:{family:'Cairo'}}}},scales:{y:{ticks:{color:'#7a8ba8'},grid:{color:'rgba(0,212,255,.08)'}},x:{ticks:{color:'#7a8ba8',font:{family:'Cairo'}},grid:{color:'rgba(0,212,255,.08)'}}}}});
}

async function loadUsers(){
    try{
        const d=await apiPost('/api/admin/users',{});
        if(!d.ok){document.getElementById('usersList').innerHTML='<div class="empty">فشل التحميل</div>';return}
        allUsers=d.users||[];
        renderUsers(allUsers);
    }catch(e){document.getElementById('usersList').innerHTML='<div class="empty">خطأ في الاتصال</div>'}
}

function renderUsers(users){
    const l=document.getElementById('usersList');
    if(!users.length){l.innerHTML='<div class="empty">لا يوجد مستخدمون</div>';return}
    l.innerHTML=users.map(u=>{
        const letter=(u.first_name||'?').charAt(0).toUpperCase();
        return '<div class="user-row"><div class="avatar">'+letter+'</div><div class="u-info"><div class="u-name">'+(u.first_name||'مجهول')+'</div><div class="u-meta">ID: '+u.user_id+'</div><div class="u-stats"><span class="chip bal">💰 '+u.balance.toFixed(2)+' MYT</span><span class="chip ref">👥 '+(u.refs||0)+'</span><span class="chip">⚡ Lv'+(u.level||1)+'</span></div></div><div class="actions"><button class="btn give" onclick="quickGive(\''+u.user_id+'\')">+100</button><button class="btn danger" onclick="quickBan(\''+u.user_id+'\')">🚫</button></div></div>';
    }).join('');
}

function filterUsers(){
    const q=document.getElementById('searchBox').value.toLowerCase().trim();
    if(!q)return renderUsers(allUsers);
    renderUsers(allUsers.filter(u=>String(u.user_id).includes(q)||(u.first_name||'').toLowerCase().includes(q)));
}

function quickGive(id){document.getElementById('giveId').value=id;document.getElementById('giveAmount').value=100;document.querySelectorAll('.tab')[2].click();toast('✅ تم تجهيز '+id+' للمنح')}

async function quickBan(id){
    if(!confirm('حظر/إلغاء حظر المستخدم '+id+'؟'))return;
    try{
        const d=await apiPost('/api/admin/ban',{target_id:id});
        if(d.ok){toast('✅ تم تنفيذ العملية');loadUsers()}else toast('❌ فشل',true);
    }catch(e){toast('❌ خطأ',true)}
}

async function doGive(){
    const id=document.getElementById('giveId').value.trim();
    const amount=parseFloat(document.getElementById('giveAmount').value);
    if(!id||!amount)return toast('املأ الحقول',true);
    try{
        const d=await apiPost('/api/admin/give',{target_id:id,amount});
        if(d.ok){toast('✅ تم المنح! الرصيد الجديد: '+d.new_balance);document.getElementById('giveId').value='';document.getElementById('giveAmount').value='';loadUsers()}else toast('❌ '+(d.error||'فشل'),true);
    }catch(e){toast('❌ خطأ في الاتصال',true)}
}

async function doBroadcast(){
    const t=document.getElementById('bcText').value.trim();
    if(!t)return toast('اكتب الرسالة',true);
    if(!confirm('إرسال الرسالة لجميع المستخدمين؟'))return;
    try{
        const d=await apiPost('/api/admin/broadcast',{text:t});
        if(d.ok){toast('✅ أُرسلت إلى '+d.sent+' مستخدم');document.getElementById('bcText').value=''}else toast('❌ '+(d.error||'فشل'),true);
    }catch(e){toast('❌ خطأ',true)}
}

loadStats();
loadUsers();
setInterval(()=>{loadStats();loadUsers()},30000);
</script>
</body>
</html>
