<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MYTOKEN Admin V2</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo',Tahoma,sans-serif}
body{background:#0a0e1a;color:#e0e6f0;min-height:100vh;padding:20px}
.login-box{max-width:400px;margin:100px auto;background:rgba(20,26,42,.9);padding:40px;border-radius:20px;border:1px solid rgba(0,255,136,.2);box-shadow:0 0 40px rgba(0,255,136,.1)}
.login-box h1{color:#00ff88;text-align:center;margin-bottom:30px;font-size:28px}
input,button{width:100%;padding:14px;margin:8px 0;border-radius:12px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.05);color:#fff;font-size:16px;outline:none}
input:focus{border-color:#00ff88;box-shadow:0 0 15px rgba(0,255,136,.3)}
button{background:linear-gradient(135deg,#00ff88,#00cc6a);color:#000;font-weight:bold;cursor:pointer;border:none;transition:.3s}
button:hover{transform:translateY(-2px);box-shadow:0 10px 25px rgba(0,255,136,.4)}
.container{max-width:1400px;margin:0 auto;display:none}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:30px;padding:20px;background:rgba(20,26,42,.8);border-radius:16px;border:1px solid rgba(0,255,136,.2)}
.header h1{color:#00ff88;font-size:24px}
.logout{padding:10px 20px;background:#ff3366;color:#fff;border:none;border-radius:10px;cursor:pointer;font-weight:bold}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px;margin-bottom:30px}
.stat-card{background:rgba(20,26,42,.9);padding:25px;border-radius:16px;border:1px solid rgba(0,255,136,.15);transition:.3s}
.stat-card:hover{border-color:#00ff88;transform:translateY(-3px)}
.stat-card .label{color:#8892b0;font-size:14px;margin-bottom:10px}
.stat-card .value{color:#00ff88;font-size:32px;font-weight:bold}
.section{background:rgba(20,26,42,.9);padding:25px;border-radius:16px;border:1px solid rgba(255,255,255,.05);margin-bottom:20px}
.section h2{color:#00ff88;margin-bottom:20px;font-size:20px;border-bottom:2px solid rgba(0,255,136,.2);padding-bottom:10px}
table{width:100%;border-collapse:collapse}
th,td{padding:12px;text-align:right;border-bottom:1px solid rgba(255,255,255,.05);font-size:14px}
th{color:#00ff88;font-weight:bold;background:rgba(0,255,136,.05)}
tr:hover{background:rgba(0,255,136,.03)}
.row-actions button{padding:6px 12px;font-size:12px;margin:0 3px;width:auto}
.btn-give{background:#00ff88;color:#000}
.btn-ban{background:#ff3366;color:#fff}
.chart-container{height:300px;margin-top:20px}
.broadcast textarea{width:100%;min-height:120px;padding:14px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);color:#fff;font-size:15px;outline:none;resize:vertical;font-family:inherit}
.broadcast textarea:focus{border-color:#00ff88}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);padding:15px 30px;border-radius:12px;background:#00ff88;color:#000;font-weight:bold;z-index:9999;display:none;box-shadow:0 10px 30px rgba(0,255,136,.4)}
.toast.error{background:#ff3366;color:#fff}
</style>
</head>
<body>

<div class="login-box" id="loginBox">
    <h1>⛏️ MYTOKEN Admin</h1>
    <input type="password" id="pwd" placeholder="كلمة المرور" onkeypress="if(event.key==='Enter')login()">
    <button onclick="login()">دخول</button>
</div>

<div class="container" id="adminPanel">
    <div class="header">
        <h1>⛏️ لوحة تحكم MYTOKEN</h1>
        <button class="logout" onclick="logout()">خروج</button>
    </div>

    <div class="stats" id="stats">
        <div class="stat-card"><div class="label">👥 إجمالي المستخدمين</div><div class="value" id="totalUsers">...</div></div>
        <div class="stat-card"><div class="label">🔥 النشطون اليوم</div><div class="value" id="activeUsers">...</div></div>
        <div class="stat-card"><div class="label">💰 إجمالي الأرصدة</div><div class="value" id="totalBalance">...</div></div>
        <div class="stat-card"><div class="label">🎁 إجمالي الإحالات</div><div class="value" id="totalRefs">...</div></div>
    </div>

    <div class="section">
        <h2>📊 رسم بياني</h2>
        <div class="chart-container"><canvas id="myChart"></canvas></div>
    </div>

    <div class="section">
        <h2>👥 إدارة المستخدمين</h2>
        <input type="text" id="searchUser" placeholder="🔍 ابحث بـ ID أو الاسم..." oninput="filterUsers()">
        <div style="overflow-x:auto">
        <table id="usersTable">
            <thead><tr><th>ID</th><th>الاسم</th><th>الرصيد</th><th>الإحالات</th><th>المستوى</th><th>إجراءات</th></tr></thead>
            <tbody id="usersBody"></tbody>
        </table>
        </div>
    </div>

    <div class="section">
        <h2>🎁 منح MYT</h2>
        <input type="number" id="giveId" placeholder="ID المستخدم">
        <input type="number" id="giveAmount" placeholder="الكمية (مثال: 100)" step="0.01">
        <button onclick="giveBalance()">🎁 منح</button>
    </div>

    <div class="section broadcast">
        <h2>📢 بث رسالة</h2>
        <textarea id="broadcastText" placeholder="اكتب الرسالة..."></textarea>
        <button onclick="sendBroadcast()">📢 إرسال للجميع</button>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API = 'https://mytoken-api.vercel.app';
const ADMIN_ID = '8063963886';
const PASSWORD = '123456789';
let allUsers = [];

function toast(msg, isError) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast' + (isError ? ' error' : '');
    t.style.display = 'block';
    setTimeout(() => t.style.display = 'none', 3000);
}

function login() {
    const p = document.getElementById('pwd').value;
    if (p === PASSWORD) {
        document.getElementById('loginBox').style.display = 'none';
        document.getElementById('adminPanel').style.display = 'block';
        loadStats();
        loadUsers();
    } else {
        toast('❌ كلمة مرور خاطئة', true);
    }
}

function logout() {
    document.getElementById('loginBox').style.display = 'block';
    document.getElementById('adminPanel').style.display = 'none';
    document.getElementById('pwd').value = '';
}

async function apiPost(endpoint, body) {
    const r = await fetch(API + endpoint, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({admin_id: ADMIN_ID, ...body})
    });
    return r.json();
}

async function loadStats() {
    try {
        const d = await apiPost('/api/admin/stats', {});
        if (!d.ok) return toast('فشل تحميل الإحصائيات', true);
        document.getElementById('totalUsers').textContent = d.total_users || 0;
        document.getElementById('activeUsers').textContent = d.active_users || 0;
        document.getElementById('totalBalance').textContent = (d.total_balance || 0).toFixed(2);
        document.getElementById('totalRefs').textContent = d.total_refs || 0;
        drawChart(d);
    } catch(e) { toast('خطأ: ' + e.message, true); }
}

function drawChart(d) {
    const ctx = document.getElementById('myChart').getContext('2d');
    if (window.myChartInstance) window.myChartInstance.destroy();
    window.myChartInstance = new Chart(ctx, {
        type: 'bar',
        data: {
            labels: ['المستخدمون', 'النشطون', 'الإحالات'],
            datasets: [{
                label: 'الإحصائيات',
                data: [d.total_users||0, d.active_users||0, d.total_refs||0],
                backgroundColor: ['rgba(0,255,136,.7)','rgba(0,200,255,.7)','rgba(255,200,0,.7)'],
                borderRadius: 10
            }]
        },
        options: {
            responsive: true, maintainAspectRatio: false,
            plugins: { legend: { labels: { color: '#e0e6f0' } } },
            scales: {
                y: { ticks: { color: '#8892b0' }, grid: { color: 'rgba(255,255,255,.05)' } },
                x: { ticks: { color: '#8892b0' }, grid: { color: 'rgba(255,255,255,.05)' } }
            }
        }
    });
}

async function loadUsers() {
    try {
        const d = await apiPost('/api/admin/users', {});
        if (!d.ok) return toast('فشل تحميل المستخدمين', true);
        allUsers = d.users || [];
        renderUsers(allUsers);
    } catch(e) { toast('خطأ: ' + e.message, true); }
}

function renderUsers(users) {
    const tb = document.getElementById('usersBody');
    tb.innerHTML = users.map(u => `
        <tr>
            <td><code>${u.user_id}</code></td>
            <td>${u.first_name || '-'}</td>
            <td style="color:#00ff88;font-weight:bold">${u.balance.toFixed(2)}</td>
            <td>${u.refs || 0}</td>
            <td>${u.level || 1}</td>
            <td class="row-actions">
                <button class="btn-give" onclick="quickGive('${u.user_id}')">+100</button>
            </td>
        </tr>
    `).join('');
}

function filterUsers() {
    const q = document.getElementById('searchUser').value.toLowerCase();
    const filtered = allUsers.filter(u =>
        String(u.user_id).includes(q) || (u.first_name||'').toLowerCase().includes(q)
    );
    renderUsers(filtered);
}

function quickGive(id) {
    document.getElementById('giveId').value = id;
    document.getElementById('giveAmount').value = 100;
    window.scrollTo({top: document.body.scrollHeight, behavior:'smooth'});
}

async function giveBalance() {
    const id = document.getElementById('giveId').value;
    const amount = parseFloat(document.getElementById('giveAmount').value);
    if (!id || !amount) return toast('املأ الحقول', true);
    const d = await apiPost('/api/admin/give', {target_id: id, amount});
    if (d.ok) { toast('✅ تم المنح. الرصيد الجديد: ' + d.new_balance); loadUsers(); }
    else toast('❌ ' + (d.error || 'فشل'), true);
}

async function sendBroadcast() {
    const text = document.getElementById('broadcastText').value.trim();
    if (!text) return toast('اكتب الرسالة', true);
    if (!confirm('إرسال للجميع؟')) return;
    const d = await apiPost('/api/admin/broadcast', {text});
    if (d.ok) { toast('✅ أُرسلت إلى ' + d.sent + ' مستخدم'); document.getElementById('broadcastText').value=''; }
    else toast('❌ ' + (d.error || 'فشل'), true);
}
</script>
</body>
</html>
